<div
            id="view-internal-network"
            class="view-section hidden operator-log-page flex flex-col w-full px-6 xl:px-8"
          >
            <div class="flex flex-col gap-4 mb-6">
              <div
                class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"
              >
                <div class="flex items-center gap-4">
                  <div>
                    <div
                      class="text-[10px] uppercase tracking-widest"
                      style="color: var(--text-subtle)"
                    >
                      Internal
                    </div>
                    <div class="text-sm mt-1" style="color: var(--text-muted)">
                      Calls between Infraveil's control plane and your launchers
                      and agents — heartbeats, policy syncs, and commands.
                    </div>
                  </div>
                  <input
                    id="internal-network-search"
                    placeholder="Search internal route, payload, call..."
                    class="ink-input text-xs font-mono-cli rounded px-3 py-2 w-64"
                    oninput="renderInternalNetwork()"
                  />
                </div>
                <div class="flex flex-wrap items-center gap-3">
                  <select
                    id="internal-network-method-filter"
                    class="ink-input text-xs font-mono-cli rounded px-3 py-2 w-32 appearance-none cursor-pointer"
                    onchange="renderInternalNetwork()"
                  >
                    <option value="all">All Methods</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                  </select>
                  <select
                    id="internal-network-limit"
                    class="ink-input text-xs font-mono-cli rounded px-3 py-2 w-32 appearance-none cursor-pointer"
                    onchange="renderInternalNetwork()"
                  >
                    <option value="60">Latest 60</option>
                    <option value="120" selected="selected">Latest 120</option>
                    <option value="200">Latest 200</option>
                    <option value="500">Latest 500</option>
                    <option value="1000">Latest 1000</option>
                    <option value="0">All loaded</option>
                  </select>
                  <button
                    onclick="clearInternalNetworkLogs()"
                    class="text-[10px] font-bold text-gray-400 hover:text-white flex items-center gap-2 uppercase tracking-widest transition-colors"
                  >
                    <i data-lucide="trash-2" class="w-3 h-3"></i> Clear
                  </button>
                  <div class="operator-quiet-status px-3 py-2 rounded-lg flex items-center gap-2">
                    <div
                      class="operator-status-dot bg-blue-400"
                    ></div>
                    <span
                      class="text-[10px] uppercase tracking-widest text-blue-400 font-bold"
                      >Live</span
                    >
                  </div>
                </div>
              </div>
              <div
                id="internal-network-summary-bar"
                class="grid grid-cols-2 xl:grid-cols-5 gap-3"
              ></div>
            </div>
            <div
              class="flex-1 acrylic-panel operator-log-shell rounded-2xl overflow-hidden flex flex-col"
            >
              <div
                class="operator-log-header flex px-6 py-3 text-[10px] font-bold uppercase tracking-widest"
                style="
                  color: var(--text-subtle);
                "
              >
                <div class="w-40">Timestamp</div>
                <div class="w-24">Source</div>
                <div class="flex-1">Service Call</div>
                <div class="w-8"></div>
              </div>
              <div
                id="internal-network-feed"
                class="operator-log-feed flex-1 custom-scroll"
              >
                <div
                  class="p-4 text-center text-xs"
                  style="color: var(--text-subtle)"
                >
                  Waiting for internal traffic...
                </div>
              </div>
            </div>
          </div>
