<div
            id="view-deployments"
            class="view-section hidden max-w-7xl mx-auto space-y-6"
          >
            <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-3">
              <div>
                <div class="text-[10px] uppercase tracking-widest font-bold" style="color: var(--text-subtle)">Workloads</div>
                <h2 class="text-xl text-white mt-1">Your deployed APIs</h2>
              </div>
              <div class="flex flex-wrap items-center gap-3">
                <div
                  id="workload-bulk-actions"
                  class="hidden items-center gap-3 rounded-xl border px-3 py-2"
                  style="border-color: var(--table-border); background: var(--nav-hover)"
                >
                  <span id="workload-selected-count" class="text-[10px] uppercase tracking-widest" style="color: var(--text-subtle)">0 selected</span>
                  <button onclick="sendSelectedNodeCommand('restart')" class="btn-secondary px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest">Restart</button>
                  <button onclick="sendSelectedNodeCommand('stop')" class="btn-secondary px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest">Stop</button>
                  <button onclick="deleteSelectedWorkloads()" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest">Delete</button>
                </div>
                <button
                  onclick="createAgentNode()"
                  class="btn-secondary px-4 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i> Add Workload
                </button>
              </div>
            </div>
            <div class="acrylic-panel rounded-2xl overflow-hidden workload-table-shell">
              <table class="w-full text-left workload-table">
                <thead>
                  <tr
                    class="text-[10px] uppercase tracking-widest border-b"
                    style="
                      color: var(--text-subtle);
                      border-color: var(--table-border);
                    "
                  >
                    <th class="px-6 py-5 font-bold w-10">
                      <input id="workload-select-all" type="checkbox" class="infraveil-check" onclick="toggleAllWorkloads(this.checked)" aria-label="Select all workloads" />
                    </th>
                    <th class="px-8 py-5 font-bold w-1/3">Identifier</th>
                    <th class="px-8 py-5 font-bold w-1/4">Type</th>
                    <th class="px-8 py-5 font-bold">Status</th>
                    <th class="px-8 py-5 font-bold">Contract Hash</th>
                    <th class="px-8 py-5 font-bold text-right">Actions</th>
                  </tr>
                </thead>
                <tbody
                  id="deployments-tbody"
                  class="text-sm"
                >
                  <tr>
                    <td
                      colspan="6"
                      class="px-8 py-5 text-center text-xs"
                      style="color: var(--text-muted)"
                    >
                      Loading deployments...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
